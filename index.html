<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordly Dictionary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Wordly Dictionary</h1>
      <button id="theme-btn">Dark Mode</button>
    </div>

    <p>Search for a word to see its definition, pronunciation, and synonyms.</p>

    <!-- Search Form -->
    <form id="search-form">
      <input type="text" id="word-input" placeholder="Enter a word (e.g. hello)...">
      <button type="submit">Search</button>
    </form>

    <!-- Error Message -->
    <p id="error-message" class="error"></p>

    <!-- Results Section -->
    <div id="result-box" class="hidden">
      <h2 id="word-title"></h2>
      <p><strong>Pronunciation:</strong> <span id="word-phonetic"></span></p>
      <p><strong>Part of Speech:</strong> <span id="part-of-speech"></span></p>
      <p><strong>Definition:</strong> <span id="definition"></span></p>
      <p><strong>Example:</strong> <span id="example"></span></p>
      <p><strong>Synonyms:</strong> <span id="synonyms"></span></p>
      <p><strong>Source:</strong> <a id="source-link" href="#" target="_blank">View Source</a></p>

      <button id="save-btn">Save Word</button>
    </div>

    <!-- Saved Words Section -->
    <div class="saved-section">
      <h3>Saved Favorite Words</h3>
      <ul id="saved-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
